<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cadastrar usuário</title>
<link rel="stylesheet" href="style.css">

<style>
/* 🔹 Faz o select ficar igual aos inputs */
select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}
</style>

</head>

<body>

<div class="container">

<h2>Cadastrar usuário</h2>

<input id="usuario" placeholder="Usuário">
<input id="senha" placeholder="Senha">

<select id="link">
  <option value="">Selecione um sistema</option>
</select>

<button onclick="cadastrar()">Cadastrar</button>

<p id="msg"></p>

</div>

<script>

const API_URL = "https://sheetdb.io/api/v1/2dh1xnnnte2ts"

// 🔹 Carregar lista de sistemas (nome + link)
function carregarLinks(){

fetch(API_URL)
.then(res => res.json())
.then(data => {

const select = document.getElementById("link")

// 🔥 Remove duplicados
const linksUnicos = new Map()

data.forEach(item => {
  if(item.nome && item.link){
    linksUnicos.set(item.link, item.nome)
  }
})

// 🔹 Preenche o select com NOME (visível) e LINK (valor)
linksUnicos.forEach((nome, link) => {

const option = document.createElement("option")
option.value = link        // valor real
option.textContent = nome  // texto amigável

select.appendChild(option)

})

})

}

carregarLinks()

// 🔹 Cadastro
function cadastrar(){

const usuario = document.getElementById("usuario").value
const senha = document.getElementById("senha").value
const link = document.getElementById("link").value

if(!link){
  document.getElementById("msg").innerText = "Selecione um sistema"
  return
}

fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
data:{
usuario:usuario,
senha:senha,
link:link
}
})
})

.then(res=>res.json())
.then(data=>{
document.getElementById("msg").innerText="Usuário cadastrado"
})

}

</script>

</body>
</html>
