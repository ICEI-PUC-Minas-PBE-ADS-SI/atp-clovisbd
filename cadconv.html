<script>
    const API_URL = "https://sheetdb.io/api/v1/2dh1xnnnte2ts";

    function cadastrar() {
        const usuario = document.getElementById("usuario").value;
        const senha = document.getElementById("senha").value;
        const link = document.getElementById("link").value;
        const msgElement = document.getElementById("msg");

        if (!usuario || !senha || !link) {
            msgElement.innerText = "Preencha todos os campos!";
            msgElement.style.color = "red";
            return;
        }

        fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                data: {
                    usuario: usuario,
                    senha: senha,
                    link: link
                }
            })
        })
        .then(res => res.json())
        .then(data => {
            msgElement.innerText = "Cadastrado com sucesso!";
            msgElement.style.color = "green";   
            document.getElementById("usuario").value = "";
            document.getElementById("senha").value = "";
            document.getElementById("link").value = "";
        })
        .catch(err => {
            msgElement.innerText = "Erro ao realizar cadastro.";
            msgElement.style.color = "red";
        });
    }
</script>
